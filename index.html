  <script>
    // System-wide proactive error capture and telemetry
    window.addEventListener('error', function(event) {
      const errorMsg = event.message || (event.error ? event.error.message : 'Unknown script or resource error');
      const errorStack = event.error ? event.error.stack : '';
      const sourceFile = event.filename || '';
      
      // Suppress harmless standard Vite HMR WebSocket issues in sandboxed system
      if (
        errorMsg.indexOf('WebSocket') !== -1 || 
        errorMsg.indexOf('websocket') !== -1 || 
        errorMsg.indexOf('vite') !== -1 || 
        errorMsg.indexOf('HMR') !== -1 ||
        errorMsg.indexOf('MetaMask') !== -1 ||
        sourceFile.indexOf('vite') !== -1
      ) {
        return;
      }

      // Post telemetry
      fetch('/api/log-error', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          error: errorMsg,
          stack: errorStack,
          url: window.location.href,
          info: `Source: ${sourceFile}:${event.lineno}:${event.colno}`
        })
      }).catch(e => console.warn("Log endpoint inaccessible:", e));

      // Visual safety fallback overlay
      var overlay = document.getElementById('nvk-runtime-safety-mesh');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'nvk-runtime-safety-mesh';
        overlay.style = 'position:fixed;inset:0;background:#03030c;color:#10b981;font-family:monospace;padding:1.5rem;z-index:999999;overflow-y:auto;border:2px solid #ef4444;box-sizing:border-box;border-radius:8px;';

          <div style="max-width:800px;margin:2rem auto;background:#000000;border:1px solid #1e293b;padding:2rem;border-radius:12px;box-shadow:0 0 30px rgba(0,255,180,0.1);">
            <div style="border-bottom:1px solid #dc2626;padding-bottom:1rem;margin-bottom:1.5rem;">
              <h1 style="color:#ef4444;margin:0;font-size:1.5rem;letter-spacing:2px;">[ NVK OS // RUNTIME CRASH RECOVERED ]</h1>
              <p style="color:#64748b;margin:0.25rem 0 0 0;font-size:0.75rem;">HIGH-ACCURACY CRITICAL LEVEL FAILURE RECORDED</p>
            </div>
            <div style="background:#1b0000;color:#f87171;padding:1rem;border-radius:6px;border:1px solid rgba(239,68,68,0.2);font-size:0.875rem;margin-bottom:1.5rem;white-space:pre-wrap;word-break:break-all;" id="mesh-error-desc"></div>
            <button onclick="window.location.reload()" style="background:#10b981;color:#03030c;border:none;padding:0.75rem 1.5rem;font-weight:bold;cursor:pointer;border-radius:6px;font-family:inherit;">RETRY HOT REBOOT</button>
            <button onclick="localStorage.clear();window.location.reload()" style="background:#ef4444;color:#ffffff;border:none;padding:0.75rem 1.5rem;font-weight:bold;cursor:pointer;border-radius:6px;font-family:inherit;margin-left:1rem;">RESET HARD STATE</button>
          </div>
        `;
        document.body.appendChild(overlay);
      }
      const descEl = document.getElementById('mesh-error-desc');
      if (descEl) {
        descEl.textContent += `\nError: ${errorMsg}\nLocation: ${sourceFile}:${event.lineno}:${event.colno}\n\nStack:\n${errorStack}`;
      }
    });

    window.addEventListener('unhandledrejection', function(event) {
      const reason = event.reason;
      const errorMsg = reason instanceof Error ? reason.message : String(reason);
      const errorStack = reason instanceof Error ? reason.stack : '';
      
      // Suppress harmless standard Vite HMR WebSocket issues in sandboxed system
      if (
        errorMsg.indexOf('WebSocket') !== -1 || 
        errorMsg.indexOf('websocket') !== -1 || 
        errorMsg.indexOf('vite') !== -1 || 
        errorMsg.indexOf('MetaMask') !== -1 || 
        errorMsg.indexOf('closed without opened') !== -1
      ) {
        return;
      }

      fetch('/api/log-error', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          error: `Unhandled Rejection: ${errorMsg}`,
          stack: errorStack,
          url: window.location.href,
          info: 'Promise unhandled rejection'
        })
      }).catch(e => console.warn("Log endpoint inaccessible:", e));

      // Visual safety fallback overlay
      var overlay = document.getElementById('nvk-runtime-safety-mesh');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'nvk-runtime-safety-mesh';

        overlay.innerHTML = `

            <div style="border-bottom:1px solid #dc2626;padding-bottom:1rem;margin-bottom:1.5rem;">
              <h1 style="color:#ef4444;margin:0;font-size:1.5rem;letter-spacing:2px;">[ NVK OS // RUNTIME CRASH RECOVERED ]</h1>
              <p style="color:#64748b;margin:0.25rem 0 0 0;font-size:0.75rem;">HIGH-ACCURACY CRITICAL LEVEL FAILURE RECORDED</p>
            </div>
            <div style="background:#1b0000;color:#f87171;padding:1rem;border-radius:6px;border:1px solid rgba(239,68,68,0.2);font-size:0.875rem;margin-bottom:1.5rem;white-space:pre-wrap;word-break:break-all;" id="mesh-error-desc"></div>
            <button onclick="window.location.reload()" style="background:#10b981;color:#03030c;border:none;padding:0.75rem 1.5rem;font-weight:bold;cursor:pointer;border-radius:6px;font-family:inherit;">RETRY HOT REBOOT</button>
            <button onclick="localStorage.clear();window.location.reload()" style="background:#ef4444;color:#ffffff;border:none;padding:0.75rem 1.5rem;font-weight:bold;cursor:pointer;border-radius:6px;font-family:inherit;margin-left:1rem;">RESET HARD STATE</button>
          </div>
        `;
        document.body.appendChild(overlay);
      }
      const descEl = document.getElementById('mesh-error-desc');
      if (descEl) {
        descEl.textContent += `\nUnhandled Rejection: ${errorMsg}\n\nStack:\n${errorStack}`;
      }
    });

  <style>
    :root {
        --space-black: #0A0A1A;
        --electric-blue: #00A4FF;
        --luminous-white: #FFFFFF;
        --accent-neon: #00FFB3;
    }

    html, body, #root {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
        font-family: 'Orbitron', sans-serif;
        background-color: var(--space-black);
        color: var(--luminous-white);
    }
    
    #codex-orb-canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        outline: none;
    }
    
    .css3d-renderer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }
    
    .css3d-renderer > div > div {
        pointer-events: auto;
    }

    /* Custom Scrollbar for Panels */
    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(30, 41, 59, 0.5); /* slate-800 */
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(71, 85, 105, 0.7); /* slate-700 */
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.9); /* slate-600 */
    }

    /* Set font-family for framer-motion components if needed */
    .font-cinzel {
      font-family: 'Cinzel', serif;
    }
    .font-cormorant {
      font-family: 'Cormorant Garamond', serif;
    }
    .rounded-button {
      border-radius: 0.375rem; /* Corresponds to rounded-md */
    }
    .bg-grid-sky-900\/20 {
      background-image: linear-gradient(rgba(56, 189, 248, 0.1) 1px, transparent 1px),
                        linear-gradient(to right, rgba(56, 189, 248, 0.1) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Panel Styles */
    .panel-title-bar {
        background: rgba(30, 41, 59, 0.02); /* slate-800 */
        padding: 10px 14px;
        cursor: grab;
        user-select: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }
    .panel-title-text {
        font-family: 'Orbitron', sans-serif;
        font-size: 14px;
        color: var(--luminous-white);
        text-shadow: 0 0 5px var(--electric-blue);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .panel-controls {
        display: flex;
        gap: 8px;
    }
    .panel-control {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background-color: rgba(71, 85, 105, 0.6); /* slate-700 */
        border: 1px solid rgba(100, 116, 139, 0.8); /* slate-600 */
        color: var(--luminous-white);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.2s;
        font-size: 12px;
    }
    .panel-control:hover {
        background-color: rgba(100, 116, 139, 1); /* slate-600 */
    }
    .panel-resize-handle {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 16px;
        height: 16px;
        cursor: se-resize;
        color: rgba(100, 116, 139, 0.8);
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        pointer-events: auto;
    }
    .pinned-panel-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1000;
    }
    .pinned-panel {
        pointer-events: auto;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        border-radius: 0.5rem;
        overflow: hidden;
        border: 1px solid rgba(100, 116, 139, 0.8);
    }
    .orb-mode-selector {
        position: absolute;
        bottom: 5.5rem; /* Position above the dock */
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.9); /* slate-900 */

        border-radius: 8px;
        border: 1px solid rgba(51, 65, 85, 1); /* slate-700 */
        padding: 0.5rem;
        display: flex;
        flex-direction: column; /* Vertical layout for menu */
        gap: 0.5rem;
        z-index: 1200; /* Ensure it's above other elements */
        pointer-events: all;
        width: 240px;
    }
    .orb-mode-button {
        background-color: rgba(51, 65, 85, 1); /* slate-700 */
        color: var(--luminous-white);
        padding: 0.6rem 1rem;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.8rem;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        text-align: left;
        width: 100%;
    }
    .orb-mode-button:hover {
        background-color: rgba(71, 85, 105, 1); /* slate-600 */
        border-color: var(--accent-neon);
    }
    .orb-mode-button.active {
        background-color: var(--accent-neon);
        color: var(--space-black);
        font-weight: bold;
        box-shadow: 0 0 10px var(--accent-neon);

      6% { opacity: 1; }
      8% { opacity: 0.85; transform: scale(1.02); }
      10% { opacity: 0.95; }
      50% { opacity: 0.9; transform: scale(1); }
      52% { opacity: 1; }
      55% { opacity: 0.88; transform: scale(0.98); }
      57% { opacity: 0.95; }
    }
    @keyframes scanline {
      0% { transform: translateY(0); opacity: 0; }

      100% { transform: translateY(100%); opacity: 0; }
